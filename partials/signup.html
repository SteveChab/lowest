<!-- Email signup. Keep the hidden honeypot field (b_...). -->
<section class="signup" aria-labelledby="signup-h"><div class="wrap grid">
<h2 id="signup-h" class="big" data-reveal>One album a&nbsp;month and the&nbsp;night to&nbsp;pray.</h2>
<form action="https://stevechab.us1.list-manage.com/subscribe/post?u=f1053750f10d214155ce8e49b&amp;id=ab0aa554cf&amp;f_id=006b1ce5f0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" data-reveal>
<div><label class="label" for="mce-EMAIL">Email address</label><input type="email" name="EMAIL" id="mce-EMAIL" autocomplete="email" required></div>
<input type="hidden" name="group[3117][1]" value="1">
<div class="hp" aria-hidden="true"><input type="text" name="b_f1053750f10d214155ce8e49b_ab0aa554cf" tabindex="-1" value="" autocomplete="off"></div>
<button class="btn" type="submit" name="subscribe" value="Subscribe">Pray with me</button>
<p class="note">Reply to any email with a prayer request.</p>
<p class="note" id="mc-msg" role="status"></p>
</form></div></section>
<script>
/* Progressive enhancement: send the signup to Mailchimp's JSONP endpoint and show the answer here, so nobody lands on Mailchimp's
   thank-you page. Without JS, or if Mailchimp does not answer in 8 seconds, the form posts the normal way. */
(function () {
  var f = document.getElementById('mc-embedded-subscribe-form'), msg = document.getElementById('mc-msg');
  if (!f || !window.URLSearchParams) return;
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = new URLSearchParams(new FormData(f)), s = document.createElement('script'), done = false,
        cb = 'mcDone' + Date.now(), btn = f.querySelector('button');
    function end() { done = true; delete window[cb]; s.remove(); btn.disabled = false; }
    window[cb] = function (r) {
      end();
      msg.textContent = new DOMParser().parseFromString(r.msg || '', 'text/html').body.textContent.replace(/^\d+ - /, '');
      if (r.result === 'success') f.reset();
    };
    q.set('c', cb);
    btn.disabled = true; msg.textContent = 'Sending\u2026';
    s.onerror = function () { if (!done) { end(); f.submit(); } };
    setTimeout(function () { if (!done) { end(); f.submit(); } }, 8000);
    s.src = f.action.replace('/post?', '/post-json?') + '&' + q;
    document.head.appendChild(s);
  });
})();
</script>
